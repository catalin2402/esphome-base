substitutions:
  hlw8012_current_resistor: REPLACEME
  hlw8012_voltage_divider: REPLACEME
  pin_hlw8012_cf: REPLACEME
  pin_hlw8012_cf1: REPLACEME
  pin_hlw8012_sel: REPLACEME
  hlw8012_update_interval: 30s
  hlw8012_current_min_voltage: '1.0'

sensor:
  - platform: hlw8012
    id: hlw8012_sensor
    model: HLW8012
    sel_pin: $pin_hlw8012_sel
    cf_pin: $pin_hlw8012_cf
    cf1_pin: $pin_hlw8012_cf1
    voltage_divider: $hlw8012_voltage_divider
    current_resistor: $hlw8012_current_resistor
    initial_mode: VOLTAGE
    change_mode_every: 4294967295
    update_interval: $hlw8012_update_interval
    power:
      name: Power
      unit_of_measurement: W
      id: power
      icon: mdi:home-lightning-bolt
      on_value:
        component.update: current
    voltage:
      name: Voltage
      unit_of_measurement: V
      icon: mdi:flash-triangle
      id: voltage

  - platform: total_daily_energy
    name: Energy
    icon: mdi:meter-electric
    power_id: power
    filters:
      multiply: 0.001
    unit_of_measurement: kWh

  - platform: template
    id: current
    name: Current
    icon: mdi:transmission-tower
    lambda: !lambda |-
      const float measured_power = id(power).state;
      const float measured_voltage = id(voltage).state;
      if (!std::isfinite(measured_power) || !std::isfinite(measured_voltage) || measured_voltage < $hlw8012_current_min_voltage)
        return NAN;
      return measured_power / measured_voltage;
    unit_of_measurement: A
    accuracy_decimals: 3
    update_interval: never
