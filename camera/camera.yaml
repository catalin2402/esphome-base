substitutions:
  pin_camera_data_1: REPLACEME
  pin_camera_data_2: REPLACEME
  pin_camera_data_3: REPLACEME
  pin_camera_data_4: REPLACEME
  pin_camera_data_5: REPLACEME
  pin_camera_data_6: REPLACEME
  pin_camera_data_7: REPLACEME
  pin_camera_data_8: REPLACEME
  pin_camera_ext_clock: REPLACEME
  pin_camera_href: REPLACEME
  pin_camera_i2c_scl: REPLACEME
  pin_camera_i2c_sda: REPLACEME
  pin_camera_pixel_clock: REPLACEME
  pin_camera_power_down: REPLACEME
  pin_camera_vsync: REPLACEME
  pin_flash: REPLACEME
  camera_max_framerate: "10 fps"
  camera_resolution: "800x600"
  camera_ext_clock: "20MHz"

psram:

i2c:
  - id: camera_i2c
    sda: $pin_camera_i2c_sda
    scl: $pin_camera_i2c_scl

output:
  - platform: ledc
    id: flash_output
    pin: $pin_flash
    channel: 7

light:
  - platform: monochromatic
    name: Flash
    icon: mdi:flash
    output: flash_output
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

esp32_camera:
  id: espcam
  external_clock:
    pin:
      number: $pin_camera_ext_clock
      ignore_strapping_warning: true
    frequency: $camera_ext_clock
  i2c_id: camera_i2c
  data_pins:
    - number: $pin_camera_data_1
      ignore_strapping_warning: true
    - $pin_camera_data_2
    - $pin_camera_data_3
    - $pin_camera_data_4
    - $pin_camera_data_5
    - $pin_camera_data_6
    - $pin_camera_data_7
    - $pin_camera_data_8
  vsync_pin: $pin_camera_vsync
  href_pin: $pin_camera_href
  pixel_clock_pin: $pin_camera_pixel_clock
  power_down_pin: $pin_camera_power_down
  name: Camera
  resolution: $camera_resolution
  idle_framerate: 1 fps
  max_framerate: $camera_max_framerate
  icon: mdi:cctv

