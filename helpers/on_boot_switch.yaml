substitutions:
  on_boot_switch_id: REPLACEME
packages:
  status_light: !include ../status/light.yaml

esphome:
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              switch.is_on: $on_boot_switch_id
            then:
              light.turn_on: device_status_light
            else:
              light.turn_off: device_status_light
